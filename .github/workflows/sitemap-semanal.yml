name: Sitemap semanal
on:
  schedule:
    - cron: '17 12 * * 0'   # domingos 12:17 UTC (6:17 am Guatemala)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 _tools/sitemap-semanal.py
      - name: Publicar si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml video-sitemap.xml
          git diff --cached --quiet || (git commit -m "Sitemap semanal" && git push)
