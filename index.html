<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ebenezer Antigua</title>
  <meta name="description" content="Ebenezer Antigua — Antigua Guatemala. Sitio en construcción.">
  <style>
    :root { --ink:#2b2118; --stone:#f4efe8; --accent:#9c5a2c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:var(--stone); color:var(--ink); font-family:Georgia, "Times New Roman", serif;
      text-align:center; padding:2rem;
    }
    .mark { width:64px; height:64px; border:2px solid var(--accent); border-radius:50% 50% 4px 4px; margin-bottom:1.5rem; }
    h1 { font-size:clamp(2.2rem,7vw,4rem); letter-spacing:.04em; font-weight:400; }
    .sub { margin-top:.75rem; font-size:1.1rem; color:var(--accent); letter-spacing:.2em; text-transform:uppercase; }
    p { margin-top:2rem; max-width:34rem; line-height:1.6; font-size:1.05rem; }
    footer { margin-top:3rem; font-size:.85rem; opacity:.6; }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true"></div>
  <h1>Ebenezer Antigua</h1>
  <div class="sub">Antigua Guatemala</div>
  <p>Estamos preparando nuestro sitio web. Muy pronto encontrarás aquí toda la información.</p>
  <footer>&copy; 2026 Ebenezer Antigua</footer>
</body>
</html>
